  <script>
    /* =========================================================
       1. 音訊核心
    ========================================================= */
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
      },
      playTone(freq, type = 'sine', duration = 0.4, when = 0) {
        this.init();
        const start = this.ctx.currentTime + when;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.3, start);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(start);
        osc.stop(start + duration);
      },
      success() {
        this.playTone(523.25, 'triangle', 0.18, 0);
        this.playTone(659.25, 'triangle', 0.18, 0.1);
        this.playTone(783.99, 'triangle', 0.35, 0.2);
      },
      error() {
        this.playTone(160, 'sawtooth', 0.3, 0);
      },
      playFigaro() {
        this.init();
        const notes = [293.66, 329.63, 370, 392, 440, 392, 370, 329.63, 293.66];
        notes.forEach((f, idx) => this.playTone(f, 'triangle', 0.16, idx * 0.1));
      },
      playDrinkingSong() {
        this.init();
        const seq = [
          { f: 311.13, d: 0.22, t: 0 }, { f: 392.00, d: 0.22, t: 0.22 },
          { f: 466.16, d: 0.22, t: 0.44 }, { f: 523.25, d: 0.4, t: 0.66 }, { f: 466.16, d: 0.4, t: 1.05 }
        ];
        seq.forEach(n => this.playTone(n.f, 'sine', n.d, n.t));
      },
      playValkyrie() {
        this.init();
        const seq = [
          { f: 293.66, d: 0.18, t: 0 }, { f: 370.00, d: 0.18, t: 0.18 },
          { f: 440.00, d: 0.3, t: 0.36 }, { f: 370.00, d: 0.18, t: 0.68 }, { f: 293.66, d: 0.4, t: 0.88 }
        ];
        seq.forEach(n => this.playTone(n.f, 'sawtooth', n.d, n.t));
      },
      playNessunDorma() {
        this.init();
        const seq = [
          { f: 329.63, d: 0.4, t: 0 }, { f: 349.23, d: 0.4, t: 0.38 }, { f: 329.63, d: 0.8, t: 0.76 }
        ];
        seq.forEach(n => this.playTone(n.f, 'triangle', n.d, n.t));
      }
    };

    /* =========================================================

        { intro: "【古籍典藏清單】「完成於1600年，為現存有完整曲譜留存的最古老歌劇典範。」", q: "這部現存最古老的歌劇名為？", opts: ["《尤麗狄斯》(Euridice)", "《茶花女》", "《達芙尼》", "《波希米亞人》"], ans: 0 },

      ]
    };

    const ARTIFACT_NAMES = {
      origin: { name: "📜 古希臘桂冠", code: "1" },
      mozart: { name: "🪞 委任狀金章", code: "6" },
      verdi_wagner: { name: "🛡️ 女武神銀羽", code: "9" },
      puccini: { name: "🏮 東方玉珮", code: "7" }
    };

    const progress = {
      origin: { idx: 0, done: false },
      mozart: { idx: 0, done: false },
      verdi_wagner: { idx: 0, done: false },
      puccini: { idx: 0, done: false }
    };

    /* 計時器邏輯（15分鐘倒數） */
    let timeLeft = 900;
    setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('countdown-timer').textContent = `${m}:${s}`;
      }
    }, 1000);

    /* =========================================================
       3. 畫面開啟與題目渲染（style.display 優先）
    ========================================================= */
    function openZone(zone) {
      Sound.init();
      const modal = document.getElementById('modal-container');
      const box = document.getElementById('modal-content');
      const st = progress[zone];
      const qList = STORY_QUESTIONS[zone];

      if (st.done) {
        box.innerHTML = `
          <div class="text-center p-3">
            <div class="text-4xl mb-2">✨</div>
            <h3 class="text-base font-bold text-amber-300 mb-2">此處搜查已完成！</h3>
            <p class="text-xs text-stone-300 mb-4">你已獲得關鍵信物：<strong class="text-amber-200">${ARTIFACT_NAMES[zone].name}</strong></p>
            <div class="bg-stone-900 p-3 rounded-xl border border-amber-600/50 mb-4 inline-block px-6">
              <span class="text-xs text-stone-400 block">信物銘刻密碼</span>
              <span class="text-2xl font-mono font-bold text-amber-300">【 ${ARTIFACT_NAMES[zone].code} 】</span>
            </div>
            <div>
              <button onclick="closeModal()" class="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2 rounded text-xs">返回後台搜查</button>
            </div>
          </div>
        `;
        modal.style.display = 'flex';
        return;
      }

      const curQ = qList[st.idx];

      box.innerHTML = `
        <div class="flex justify-between items-center border-b border-amber-900/40 pb-2 mb-3">
          <span class="text-xs font-mono text-amber-400 font-bold">🔍 線索搜查：第 ${st.idx + 1} / 10 步</span>
          <span class="text-[11px] text-stone-400">距離獲得信物還有 ${10 - st.idx} 題</span>
        </div>

        <div class="bg-black/30 border-l-2 border-amber-500 p-2.5 rounded mb-3 text-xs text-amber-100/90 leading-relaxed italic font-serif">
          ${curQ.intro}
        </div>

        <h3 class="text-xs md:text-sm font-bold text-stone-100 mb-3 leading-relaxed">
          ${curQ.q}
        </h3>

        ${curQ.audio ? `
          <div class="bg-stone-950/80 p-3 rounded-xl border border-amber-900/60 text-center mb-3">
            <button onclick="Sound.${curQ.audio}()" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-3 py-1.5 rounded-lg text-xs inline-flex items-center gap-1.5 shadow active:scale-95">
              <span>▶️ 點擊播放現場音訊</span>
            </button>
            <span class="text-[10px] text-stone-400 block mt-1">（請仔細聆聽旋律與配器特徵）</span>
          </div>
        ` : ''}

        <div class="space-y-2 mb-3">
          ${curQ.opts.map((opt, i) => `
            <button onclick="chooseAnswer('${zone}', ${i})"
                    class="w-full text-left p-2.5 rounded-xl bg-stone-900/80 hover:bg-amber-950/50 text-stone-200 text-xs border border-amber-900/30 transition">
              <span class="font-bold text-amber-400 mr-1">${String.fromCharCode(65 + i)}.</span> ${opt}
            </button>
          `).join('')}
        </div>

        <div id="zone-feedback" class="text-xs text-center min-h-[1rem]"></div>
      `;

      modal.style.display = 'flex';
    }

    function closeModal() {
      const modal = document.getElementById('modal-container');
      modal.style.display = 'none';
    }

    /* =========================================================
       4. 判定與道具獲得
    ========================================================= */
    function chooseAnswer(zone, selected) {
      const st = progress[zone];
      const curQ = STORY_QUESTIONS[zone][st.idx];
      const fb = document.getElementById('zone-feedback');

      if (selected === curQ.ans) {
        Sound.success();
        fb.innerHTML = `<span class="text-green-400 font-bold">✅ 判斷正確！線索浮現……</span>`;
        st.idx++;

        if (st.idx >= 10) {
          st.done = true;
          // 解開此區道具
          document.getElementById(`label-${zone}`).textContent = `✅ 已搜出信物 (${ARTIFACT_NAMES[zone].code})`;
          document.getElementById(`label-${zone}`).className = 'text-[10px] text-green-400 mt-1 font-bold';
          
          const slot = document.getElementById(`slot-${zone}`);
          slot.textContent = `${ARTIFACT_NAMES[zone].name} [${ARTIFACT_NAMES[zone].code}]`;
          slot.className = 'px-2.5 py-1 bg-amber-950/80 border border-amber-600 rounded text-xs text-amber-300 font-mono font-bold';
          
          checkDirectorBroadcast();
          setTimeout(() => openZone(zone), 500);
        } else {
          document.getElementById(`label-${zone}`).textContent = `進度 ${st.idx}/10`;
          setTimeout(() => openZone(zone), 400);
        }
      } else {
        Sound.error();
        fb.innerHTML = `<span class="text-red-400 font-bold">❌ 判斷失誤，道具未產生反應！</span>`;
      }
    }

    function checkDirectorBroadcast() {
      let count = 0;
      ['origin', 'mozart', 'verdi_wagner', 'puccini'].forEach(z => {
        if (progress[z].done) count++;
      });
      const broadcast = document.getElementById('director-msg');
      if (count === 1) broadcast.textContent = "劇院廣播：第一道機關鬆動了！演員已著裝完畢，請加速！";
      if (count === 2) broadcast.textContent = "劇院廣播：側台指示燈已亮起一半，樂池已進入最後排練！";
      if (count === 3) broadcast.textContent = "劇院廣播：只差最後一處信物！總監已抵達指揮台！";
      if (count === 4) broadcast.textContent = "劇院廣播：四樣信物已全部現世！立刻前往鐵門輸入密碼！";
    }

    function escapeStage() {
      const code = document.getElementById('final-code').value.trim();
      // 正確密碼：1697
      if (code === '1697') {
        Sound.success();
        alert('🎉【首演大獲成功！】\n鐵門轉輪發出巨大轟鳴並開啟！交響樂團前奏響起，大幕在歡呼聲中拉開！\n你拯救了今晚的歌劇首演！');
      } else {
        Sound.error();
        alert('❌ 鐵門紋絲不動！請確認四件信物是否皆已收集，並按順序填入銘刻的 4 碼數字（1697）。');
      }
    }

    function resetGame() {
      ['origin', 'mozart', 'verdi_wagner', 'puccini'].forEach(z => {
        progress[z].idx = 0;
        progress[z].done = false;
        document.getElementById(`label-${z}`).textContent = '未檢視';
        document.getElementById(`label-${z}`).className = 'text-[10px] text-stone-400 mt-1';
        const slot = document.getElementById(`slot-${z}`);
        slot.textContent = '［空］';
        slot.className = 'px-2.5 py-1 bg-stone-950 border border-stone-700 rounded text-xs text-stone-500 font-mono';
      });
      document.getElementById('final-code').value = '';
      document.getElementById('director-msg').textContent = '劇院廣播：大門已被誤鎖，請在管弦樂團序曲結束前解開四處機關！';
      timeLeft = 900;
      closeModal();
    }
  </script>
